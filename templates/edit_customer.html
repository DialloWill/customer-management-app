<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer</title>
</head>
<body>
    <h1>Edit Customer</h1>
    <form method="POST">
        <label>Name:</label>
        <input type="text" name="name" value="{{ customer[1] }}" required><br><br>
        
        <label>Location:</label>
        <input type="text" name="location" value="{{ customer[2] }}" required><br><br>
        
        <label>Amount:</label>
        <input type="number" name="amount" value="{{ customer[3] }}" required><br><br>
        
        <button type="submit">Update Customer</button>
    </form>
    <p><a href="/">Back to Dashboard</a></p>
</body>
</html>
